<!DOCTYPE html>
<!-- =========================================================
     PAGE TEMPLATE — copy this folder to pages/<page-name>/ and edit.
     Folders starting with "_" are not published by GitHub Pages (Jekyll skips them),
     so this template never goes live by itself.
     clc.js adds the header and the contact & legal section automatically.
     ========================================================= -->
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page Title | Cheri Long Commercial</title>
  <meta name="description" content="One sentence describing this page for Google (about 150 characters).">
  <link rel="canonical" href="https://{{SUBDOMAIN}}/pages/page-name/">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/clc.css?v=1001">
  <style>
    body { margin: 0; background: #FFFFFF; }
    html { visibility: hidden; background: #000000; }
    html.clc-ready { visibility: visible; }
    /* Page-specific styles: prefix every class with a short page code (e.g. .lg- for a leasing guide) */
  </style>
  <script>setTimeout(function(){document.documentElement.classList.add('clc-ready');},2500);</script>
</head>
<body>

<main class="clc" id="clc-page">

  <!-- Page hero -->
  <section class="clc-hero clc-hero--page">
    <div class="clc-hero-photo" aria-hidden="true"></div>
    <div class="clc-wrap">
      <p class="clc-eyebrow">Section label</p>
      <h1>Page headline goes here</h1>
      <p class="clc-sub">A short line that tells the reader what this page will help them do.</p>
    </div>
  </section>

  <!-- Body content -->
  <section class="clc-section">
    <div class="clc-wrap"><div class="clc-prose">
      <h2>First heading</h2>
      <p>Write the page content here. Keep paragraphs short and plain.</p>
      <ul>
        <li>Point one</li>
        <li>Point two</li>
      </ul>
      <div class="clc-cta-row">
        <a class="clc-btn clc-btn-red" href="#clc-contact">Talk to Our Team</a>
      </div>
    </div></div>
  </section>

</main>

<script src="../../assets/js/clc.js?v=1001"></script>
</body>
</html>
