<!-- Page redirects: old BoldTrail pages -> new pages on info.cherilongcommercial.com.
     Runs first, before anything loads. Add a line per page: '/old-page.php': 'new address'. -->
<script>
(function () {
  var REDIRECTS = {
    '/contact.php': 'https://info.cherilongcommercial.com/contact/',
    '/contact':     'https://info.cherilongcommercial.com/contact/',
    '/about':       'https://info.cherilongcommercial.com/about/'
  };
  // Lower-case and ignore a trailing slash, so /Contact/ and /contact both match
  var path = location.pathname.toLowerCase().replace(/\/+$/, '') || '/';
  var to = REDIRECTS[path];
  if (to) location.replace(to);
})();
</script>

<!-- FOUC guard: hide the page until our header is in place, on black so the flash
     matches the dark hero. Once ready the black is REMOVED: BoldTrail's inner pages make
     <body> one screen tall and let content overflow it, so a black <html> background
     would show behind everything below the first screen (property pages). -->
<style>
  html { visibility: hidden; background: #000000; }
  html.clc-ready { visibility: visible; background: transparent; }
</style>

<!-- Safety fallback: reveal even if JS fails -->
<script>
  setTimeout(function () {
    document.documentElement.classList.add('clc-ready');
  }, 2500);
</script>

<!-- Homepage description for Google and social shares.
     Also set the same text in BoldTrail's SEO settings (social sites don't run scripts). -->
<script>
(function () {
  var p = location.pathname;
  if (!(p === '/' || p === '/index.php' || p === '/index.html') || location.search) return;
  var TEXT = 'Calgary commercial, industrial, retail and land real estate with Associate Broker Cheri Long. 30+ years of local experience. Call 403-860-9419.';
  function set() {
    [['name', 'description'], ['property', 'og:description'], ['name', 'twitter:description']].forEach(function (m) {
      var el = document.querySelector('meta[' + m[0] + '="' + m[1] + '"]');
      if (!el) { el = document.createElement('meta'); el.setAttribute(m[0], m[1]); document.head.appendChild(el); }
      el.setAttribute('content', TEXT);
    });
  }
  set();
  document.addEventListener('DOMContentLoaded', set);
})();
</script>
