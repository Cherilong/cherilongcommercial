<!-- Preload CLC script (loaded from Custom Body Code) -->

<!-- FOUC guard: hide page until Cheri's header is in place.
     Black so any flash matches the dark hero. -->
<style>
  html { visibility: hidden; background: #000000; }
  html.clc-ready { visibility: visible; }
</style>

<!-- Safety fallback: reveal even if JS fails -->
<script>
  setTimeout(function () {
    document.documentElement.classList.add('clc-ready');
  }, 2500);
</script>
